# FreshTrack CI: checks the code before any image is built.
# One job, steps run top to bottom: CHECK -> TEST -> SCAN.
# If a step fails, the steps after it are skipped and the run goes red.
name: CI

# When to run: on every push to any branch, and on every pull request.
on:
  pull_request:
  push:
    branches: ["**"]

# The workflow's token can read the repo but never change it.
permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Download the code without leaving a Git token on the runner.
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Install Python 3.12.
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Locked install: ready-made wheels only, every file checked against its hash.
      - name: Install our tools (locked)
        run: "pip install --only-binary :all: --require-hashes -r api/requirements-dev.txt"

      # 1. CHECK - is the code clean?
      - name: Lint
        run: ruff check api/

      - name: Format check
        run: ruff format --check api/

      # 2. TEST - does the code work?
      - name: Unit tests
        working-directory: api
        run: pytest -v

      # 3. SCAN - is it safe?
      # bandit: risky patterns in our own Python code (tests skipped: they use assert on purpose).
      - name: Scan our code (bandit)
        run: bandit -r api/ -x api/tests

      # Trivy: known vulnerabilities in our packages + secrets left in our files.
      # Official image pinned by digest; our code is mounted read-only.
      - name: Scan packages and secrets (Trivy)
        run: >-
          docker run --rm -v "$PWD:/src:ro"
          ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          fs --scanners vuln,secret --exit-code 1 /src
      # 4. BUILD - cook the image. Tagged with the commit SHA, so every image traces back to its exact code.
      - name: Build the api image
        run: docker build -t "freshtrack-api:$GITHUB_SHA" api/

      # 5. PROVE - start the image and check it answers /health, like the local test.
      # gunicorn needs a moment to start; curl retries every second (up to 10 times) on any error.
      # --fail turns an HTTP error into a red step.
      - name: Prove the image starts (/health)
        run: |
          docker run -d --name ft-api -p 8000:8000 "freshtrack-api:$GITHUB_SHA"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 http://localhost:8000/health

      # Always print the container's logs, even when a step above failed, so we can see why.
      - name: Show container logs
        if: always()
        run: docker logs ft-api
