# FreshTrack CI pipeline: Check -> Build -> Prove -> Scan -> Ship
# This file currently covers stage 1 (CHECK): lint and test run in parallel.
name: CI

# When to run: on every pull request, and again after a merge to main.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the pipeline can only read the repo, never write to it.
permissions:
  contents: read

# If a newer commit is pushed to the same branch, cancel the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CHECK (1/2): lint - is the code written cleanly and formatted consistently?
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Download the repo code. Actions are pinned to a full commit SHA (verified against the tag).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave a Git token on the runner
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip # reuse downloaded packages between runs
          cache-dependency-path: api/requirements-dev.txt
      # Locked install: exact versions, wheels only, every file checked against its hash.
      - run: "pip install --only-binary :all: --require-hashes -r api/requirements-dev.txt"
      # Find code errors (unused imports, undefined names, ...).
      - run: ruff check api/
      # Fail if any file is not formatted; changes nothing.
      - run: ruff format --check api/

  # CHECK (2/2): test - does the code do what it should?
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip # reuse downloaded packages between runs
          cache-dependency-path: api/requirements-dev.txt
      - run: "pip install --only-binary :all: --require-hashes -r requirements-dev.txt"
      - run: pytest -v
